# Publishes the licence server (server/) to Cloudflare Workers through tower's shared workflow.
# The Cloudflare token and the database id come from tower (kajisho5/tower, projects/backhaul.toml).
name: deploy gate
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    uses: kajisho5/tower/.github/workflows/deploy-workers.yml@f6911432850c58a144002d690cdd778a7be091c8  # tower main, 2026-11-28
    with:
      working-directory: server
      # Type-check and test first; then put the database id (a repository variable set by tower) into the config.
      build-command: >-
        npm run check && npm test &&
        test -n "${{ vars.CF_D1_BACKHAUL_GATE_ID }}" &&
        sed -i "s/D1_ID_FILLED_IN_BY_THE_DEPLOY_WORKFLOW/${{ vars.CF_D1_BACKHAUL_GATE_ID }}/" wrangler.jsonc
      command: |
        d1 migrations apply backhaul-gate --remote
        deploy
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
