name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: gate server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  app-windows:
    name: app (windows, Qt ${{ matrix.qt }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Qt 6.11 and 6.12 could not be installed by this action on 2026-11-27
        # ("Failed to locate XML data"). Move to 6.12 LTS once that works.
        qt: ['6.8.3']
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
        with:
          version: ${{ matrix.qt }}
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -DBACKHAUL_BUILD_APP=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Picture of the operator screen (demo data)
        shell: pwsh
        env:
          QT_QUICK_BACKEND: software
        run: |
          $exe = Get-ChildItem -Recurse build -Filter backhaul.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--demo','--screenshot',"$PWD\operator-windows.png" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "backhaul exited with $($p.ExitCode)" }
          if (-not (Test-Path operator-windows.png)) { throw "no picture was written" }
          foreach ($page in 'zoom','slots','audio','video','project') {
            $p = Start-Process -FilePath $exe.FullName -ArgumentList '--demo','--settings',$page,'--screenshot',"$PWD\settings-$page-windows.png" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "backhaul --settings $page exited with $($p.ExitCode)" }
            if (-not (Test-Path "settings-$page-windows.png")) { throw "no picture of the $page settings was written" }
          }
          foreach ($role in 'ask','camera','twoshot','slide','audio','return') {
            $p = Start-Process -FilePath $exe.FullName -ArgumentList '--demo','--role',$role,'--screenshot',"$PWD\role-$role-windows.png" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "backhaul --role $role exited with $($p.ExitCode)" }
            if (-not (Test-Path "role-$role-windows.png")) { throw "no picture of the $role role was written" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: operator-screen-windows-qt${{ matrix.qt }}
          path: |
            operator-windows.png
            settings-slots-windows.png
            settings-audio-windows.png
            settings-video-windows.png
            role-*-windows.png
            settings-zoom-windows.png
            settings-project-windows.png

  app-linux:
    name: app (ubuntu 24.04, Qt 6.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript fonts-noto-cjk
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBACKHAUL_BUILD_APP=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Picture of the operator screen (demo data)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          python3 tools/check_texts.py
          ./build/src/app/backhaul --demo --screenshot operator-linux.png
          ./build/src/app/backhaul --demo --language ja --screenshot operator-ja-linux.png
          ./build/src/app/backhaul --demo --settings slots --screenshot settings-slots-linux.png
          ./build/src/app/backhaul --demo --settings audio --screenshot settings-audio-linux.png
          ./build/src/app/backhaul --demo --settings video --screenshot settings-video-linux.png
          ./build/src/app/backhaul --demo --settings zoom --screenshot settings-zoom-linux.png
          ./build/src/app/backhaul --demo --settings project --screenshot settings-project-linux.png
          ./build/src/app/backhaul --demo --role all --return on --settings return --screenshot settings-return-linux.png
          ./build/src/app/backhaul --demo --role all --return on --screenshot role-all-return-linux.png
          ./build/src/app/backhaul --demo --role ask --screenshot role-ask-linux.png
          ./build/src/app/backhaul --demo --role camera --screenshot role-camera-linux.png
          ./build/src/app/backhaul --demo --role twoshot --screenshot role-twoshot-linux.png
          ./build/src/app/backhaul --demo --role audio --screenshot role-audio-linux.png
          ./build/src/app/backhaul --demo --role slide --screenshot role-slide-linux.png
          ./build/src/app/backhaul --demo --role return --screenshot role-return-linux.png
      - uses: actions/upload-artifact@v4
        with:
          name: operator-screen-linux
          path: |
            operator-linux.png
            settings-slots-linux.png
            settings-audio-linux.png
            settings-video-linux.png
            settings-zoom-linux.png
            settings-project-linux.png
            role-*-linux.png
